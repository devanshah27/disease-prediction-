<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Disease Predictor</title>
<link rel="stylesheet" href="{{ dated_url_for('static', filename='css/styles.css') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('index') }}">Disease Predictor</a>
    <div>
      <a class="btn btn-outline-primary me-2" href="{{ url_for('symptoms') }}">Enter Symptoms</a>
      <a class="btn btn-outline-success" href="{{ url_for('doctors') }}">Doctors</a>
    </div>
  </div>
</nav>

<div class="container my-5">
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <div class="alert alert-warning">
        {% for msg in messages %}
          <p>{{ msg }}</p>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>

<footer class="text-center mt-5 py-3 text-muted">
    &copy; 2025 Disease Predictor
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
