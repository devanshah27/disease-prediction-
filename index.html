{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-9">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-3">Check your symptoms</h3>
        <form method="post" action="{{ url_for('predict') }}">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Name</label>
              <input name="name" class="form-control" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Age</label>
              <input name="age" type="number" class="form-control" required min="0">
            </div>
            <div class="col-md-3">
              <label class="form-label">Gender</label>
              <select name="gender" class="form-select">
                <option value="">Prefer not to say</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
              </select>
            </div>

            <div class="col-md-3">
              <label class="form-label">Height (cm)</label>
              <input name="height" type="number" class="form-control">
            </div>
            <div class="col-md-3">
              <label class="form-label">Weight (kg)</label>
              <input name="weight" type="number" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Allergies (comma separated)</label>
              <input name="allergies" class="form-control">
            </div>

            <div class="col-12">
              <label class="form-label">Symptoms (type separated by semicolon or comma)</label>
              <textarea name="symptoms_text" id="symptoms_text" class="form-control" placeholder="e.g. fever; cough" required></textarea>
              <div class="form-text">Tip: click "Pick Symptoms" to add from a list.</div>
            </div>

            <div class="col-12">
              <label class="form-label">Past surgeries</label>
              <input name="surgeries" class="form-control">
            </div>
            <div class="col-12">
              <label class="form-label">Family medical history</label>
              <input name="family_history" class="form-control">
            </div>

            <div class="col-12 text-end">
              <button class="btn btn-primary mt-2" type="submit">Get Prediction</button>
            </div>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
